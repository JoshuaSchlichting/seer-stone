version: '3'

tasks:
  dev:
    desc: Run the app with the built-in Wails MCP server enabled
    cmds:
      - WAILS_MCP=1 wails3 dev
  build:
    desc: Build a production app (MCP is not enabled)
    cmds:
      # wails3 build dispatches to this task; do not call it recursively.
      # Frontend assets are static and embedded by main.go.
      - go build -tags production -trimpath -buildvcs=false -ldflags="{{if eq OS "windows"}}-H windowsgui {{end}}-w -s" -o "build/bin/seer-stone{{if eq OS "windows"}}.exe{{end}}" .
  check:
    desc: Compile-check the Go application
    cmds:
      - go test ./...
  bindings:
    desc: Regenerate Wails JavaScript service bindings
    cmds:
      - wails3 generate bindings -b -d frontend/bindings .
